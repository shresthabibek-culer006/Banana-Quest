<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Banana Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Navigation Bar Mount Point -->
  <div id="navbarRoot"></div>

  <main class="main-content">
    <div class="container">
      <div class="card auth-card">
        <div class="brand-icon" style="font-size: 3.5rem; margin-bottom: 0.5rem;">🍌</div>
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your Banana Quest account to continue your run.</p>

        <!-- Dynamic Alert Feedback Banner -->
        <div id="alertBox" class="alert"></div>

        <!-- AUTH: Login form transmitting credentials to server session -->
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="e.g. banana_master" 
              required 
              autocomplete="username"
            >
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
          </div>

          <!-- EVENT: Submit button triggers auth.js handler -->
          <button type="submit" id="submitBtn" class="btn btn-primary btn-full" style="margin-top: 1rem;">
            Sign In
          </button>
        </form>

        <p style="margin-top: 1.5rem; font-size: 0.92rem; color: var(--text-muted);">
          Don't have an account yet? 
          <a href="/register.html" style="font-weight: 600;">Create one here</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>University of Bedfordshire &bull; CIS046-3 Software For Enterprise &bull; Assignment 1</p>
    </div>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
